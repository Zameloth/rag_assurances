  question: L'article L113-15-2, ça change quoi pour résilier mon assurance auto en cours d'année ?
  expected_points:
  - Après un an de contrat, l’assuré peut résilier à tout moment sans frais ni pénalités.
  - La résiliation prend effet un mois après réception de la notification par l’assureur.
  retrieved_citation_ids:
