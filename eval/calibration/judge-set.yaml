  context: |-
    ### Fiches service-public.fr

    — Assurance dégâts des eaux · Quand et comment intervient l’indemnisation de l’assurance après un dégât des eaux ?
    Après un dégât des eaux, votre assurance suit une procédure définie par votre contrat pour déterminer l’indemnisation, préciser les délais et franchises, expliquer comment la décision est communiquée et indiquer les recours possibles en cas de désaccord. Délai et franchise L’assureur doit vous indemniser dans le délai prévu par votre contrat. Ce délai peut varier selon les compagnies et la complexité du sinistre. Si le dossier est simple (sans expertise), la décision est généralement rapide. En cas d’expertise, le traitement peut prendre plus de temps. La plupart des contrats prévoient une franchise . Procédure d’indemnisation Si l’assureur accepte de vous indemniser, vous recevez un courrier précisant sa décision et le montant proposé. Une fois la proposition acceptée, le paiement intervient dans le délai prévu au contrat (en général 1 mois) . En cas de désaccord Si vous contestez le montant proposé ou un refus d’indemnisation, vous pouvez répondre à l’assureur en présentant vos arguments. Vous pouvez demander une copie du rapport d’expertise. Même si la loi n’impose pas aux assureurs de le transmettre, la profession s’est engagée à le faire.

    — Assurance dégâts des eaux · Déclaration de sinistre
    Si vous êtes victime d'un sinistre dégât des eaux, vous devez prévenir votre assureur dès que vous avez connaissance du sinistre, et au plus tard dans le délai fixé par le contrat. Ce délai est au minimum de 5 jours ouvrés . Vous devez vous adresser à votre compagnie d'assurance ou au courtier d'assurance qui gère vos contrats. Les coordonnées de la compagnie d'assurance et du courtier figurent sur les quittances ou dans le contrat. La déclaration peut se faire selon les cas par téléphone ou en vous rendant directement à l'agence de l'assureur. Certains assureurs permettent également de faire la déclaration en ligne. Il faut vérifier cette possibilité sur le site internet de votre compagnie d'assurance. Si vous ne pouvez pas le faire en ligne, il est préférable d'adresser une déclaration par courrier, de préférence par lettre recommandée avec accusé de réception, à votre assureur. Prévoyez éventuellement une copie de ce courrier à votre agent d'assurances ou votre courtier. Indiquez dans ce courrier les informations suivantes : Coordonnées (nom, adresse) Numéro de votre contrat d'assurance Description du sinistre (nature, date, heure, lieu) État estimatif des meubles et objets détruits ou détériorés Description des dommages (matériels ou corporels, importance) Dégâts causés à des tiers (par exemple si une fuite d'eau chez vous a occasionné des dégâts chez vos voisins) Démarches déjà entreprises (intervention d'un plombier) Coordonnées des victimes s'il y en a.

    — Assurance dégâts des eaux · Y-a-t-il forcément une expertise à la suite d’un dégât des eaux ?
    Un dégât des eaux n’entraîne pas automatiquement la réalisation d'une expertise . C'est l'assureur qui décide s'il est nécessaire de procéder à une expertise ou non avant de vous indemniser. En général, l'assureur ordonne une expertise si le dommage est supérieur à 1 600 € . Le rôle de l'expert est alors d'évaluer les dommages et de déterminer les causes du sinistre. Si l'assureur décider de faire réaliser une expertise, elle doit vous prévenir de la date et de l'heure de passage de l'expert. À savoir Les compagnies d'assurance ont signé entre elles des conventions pour régler les sinistres dégât des eaux les moins importants au plus vite et sans expertise préalable. Il est important de conserver tous les objets qui ont été endommagés lors du sinistre, même détériorés, et de rassembler tout ce qui peut permettre d'identifier les biens détruits dans le sinistre (factures, photos, bons de garantie...). Avant le passage de l'expert, vous pouvez faire établir des devis de remise en état des locaux. Mais il ne faut pas commencer les travaux de remise en état avant le passage de l'expert.

    — Assurance habitation et vol : conditions de prise en charge · Peut-on contester le montant de l'indemnisation à la suite d'un vol ?
    Oui. Si vous estimez que l’indemnisation est insuffisante, vous pouvez adresser une réclamation à votre assureur. En cas de désaccord persistant, vous pouvez saisir gratuitement le médiateur de l’assurance . Enfin, vous avez la possibilité de saisir la justice . Attention Toute action en justice liée à un contrat d’assurance doit être engagée dans un délai de 2 ans à compter du sinistre ou de la date à laquelle vous en avez eu connaissance.

    — Assurance dégâts des eaux
    Vous êtes victime d’un dégât des eaux dans votre logement ? La première étape consiste à limiter les dommages en identifiant et stoppant la fuite , puis à informer rapidement votre assurance. Si vous disposez d’une assurance habitation, vous devez déclarer le sinistre dans les 5 jours ouvrés suivant sa découverte. Comment déclarer le sinistre et obtenir une indemnisation ? Nous vous présentons les informations à connaître.

    — Assurance dommages-ouvrage · Quelle suite donner à l'offre d'indemnité proposée par l'assureur dommages-ouvrage ?
    Vous avez le choix d'accepter ou de refuser l'offre d'indemnité. Si vous acceptez l'offre d'indemnité L'indemnité doit être versée dans un délai de 15 jours calendaires . Si votre assureur ne respecte pas ce délai, vous pouvez lui notifier que vous engagez les dépenses nécessaires à la réparation des dommages. L'indemnité versée par l'assureur est alors majorée d'un intérêt égal au double du taux de l'intérêt légal . L'indemnité sera utilisée uniquement pour la remise en état effective du bâtiment ou du terrain sur lequel il est implanté. L'assureur peut vous demander de justifier le montant des travaux de réparation que vous avez effectués. Attention Dans les cas de difficultés exceptionnelles en raison de la nature ou de l' importance du sinistre , l'assureur peut, en même temps qu'il notifie son accord, vous proposer la fixation d'un délai supplémentaire pour l'établissement de son offre d'indemnité. Ce délai ne peut excéder 135 jours calendaires. Si vous estimez l'offre insuffisante Si vous estimez que la proposition d'indemnisation est insuffisante et que les réparations ne peuvent pas attendre, vous pouvez demander une avance à votre assureur en attendant la résolution du litige. Cette avance forfaitaire, au moins égale aux 3/4 du montant de l'indemnité proposée, est à valoir sur le montant définitif de l'indemnité qui sera mise à la charge de l'assureur. Elle est versée en une seule fois par l'assureur dans un délai maximum de 15 jours calendaires courant à compter de la réception de votre courrier. Vous pouvez engager les travaux nécessaires après avoir informé l'assureur par lettre recommandée avec avis de réception en vous aidant, par exemple, du modèle suivant : Informer son assureur des réparations engagées à la suite d'une déclaration de sinistre Institut national de la consommation (INC) Vous pouvez exiger de l'assureur le paiement d'un intérêt égal au double du taux de l'intérêt légal .

    — Catastrophe naturelle ou technologique : indemnisation par l’assurance · Sous quel délai est-on indemnisé après une catastrophe naturelle ?
    L’assureur doit : verser une provision dans les 2 mois suivant la remise de l’état estimatif des dommages ou la publication de l’arrêté, puis verser l’ indemnisation complète dans un délai de 3 mois . À savoir Des dispositions plus avantageuses peuvent être prévues dans votre contrat.

    ### Code des assurances

    — Annexe art. A211-11
    Surveillez les délais afin d'accélérer le règlement de votre dossier. En particulier si un mois après l'accident vous n'avez aucune nouvelle de l'assureur du responsable, prenez contact avec lui. Remarque. Le dispositif mis en place par la loi a pour objet de réduire le nombre de procès et d'accélérer l'indemnisation des victimes. Cependant, vous avez la possibilité à tout moment : -d'introduire devant le tribunal un référé (procédure d'urgence pour obtenir une avance sur indemnité), particulièrement en cas d'inaction persistante de l'assureur du responsable ; -de faire intervenir le juge en cas de désaccord persistant sur : -le taux de responsabilité, -le caractère inexcusable d'une faute, -le montant de l'offre d'indemnisation ; -de vous constituer partie civile ou d'engager une procédure judiciaire à l'encontre des auteurs de l'accident que vous estimez responsables.
