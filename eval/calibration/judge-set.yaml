  question: Est-ce que je serai remboursé si je me fais renverser en tant que piéton, même si c’est de
    ma faute ?
  expected_points:
  - En tant que piéton victime d’un accident de la route, vous serez indemnisé pour vos dommages corporels
    même si l’accident est de votre faute.
  - L’indemnisation couvre intégralement les préjudices corporels, sans tenir compte de la responsabilité
    du conducteur ou de la vôtre.
  - Seule une faute intentionnelle (comme une tentative de suicide) peut exclure le droit à indemnisation.
  retrieved_citation_ids:
  - Annexe art. A211-11
  context: |-
    ### Fiches service-public.fr

    — Accident de la route : indemnisation des victimes de dommages corporels · Piéton ou passager victime
    Les piétons et les passagers victimes d’un accident de la route bénéficient d’une indemnisation intégrale pour leurs dommages corporels, quelle que soit la responsabilité du conducteur. Toutefois, une exception existe : si la victime a volontairement provoqué l’accident (par exemple dans le cadre d’une tentative de suicide), elle peut être exclue du droit à indemnisation.

    — Accident de la route : indemnisation par le Fonds de garantie des victimes · Dans quels cas le FGAO peut-il réduire ou refuser l’indemnisation ?
    Le FGAO peut refuser de vous indemniser dans certains cas. Le FGAO examine attentivement les conditions d’intervention et peut réduire ou refuser l’indemnisation si la victime a commis une faute ayant contribué à la survenance ou à l’aggravation de son dommage. Les cas d'exclusion varient suivant que l'accident a été causé par un véhicule terrestre à moteur, par un animal ou un objet, ou par un piéton :

    — Accident de la route : indemnisation des victimes de dommages corporels · Quelle victime peut être indemnisée à la suite d'un accident de la route ?
    Les conditions d'indemnisation diffèrent selon que vous soyez une victime extérieure à l'accident (piéton ou passager) ou le conducteur d'un des véhicules impliqués.

    — Accident de la route : indemnisation par le Fonds de garantie des victimes · Dans quels cas le FGAO n’intervient pas ?
    Le FGAO ne vous indemnisera pas dans les situations suivantes : Vous êtes le conducteur responsable de l’accident ou son ayant droit L’accident est causé par un véhicule immatriculé à l’étranger régulièrement assuré Vous êtes propriétaire ou gardien de l’animal ou de l’objet à l’origine de l’accident Les membres de votre famille (ascendants ou descendants) lorsque leur responsabilité est engagée L’accident est causé par un piéton et vous en êtes l’auteur sans être conducteur d’un véhicule terrestre à moteur. Le FGAO peut réduire ou refuser l’indemnisation lorsque la victime a commis une faute ayant contribué à la survenance ou à l’aggravation du dommage.

    — Accident : comment sont indemnisés les dommages matériels autres que les dégâts du véhicule ? · Comment l'assureur indemnise-t-il les frais de déplacement en cas d'indisponibilité du véhicule à la suite d'un accident ?
    Si votre contrat d'assurance le prévoit, vous pouvez être indemnisé pour les frais occasionnés par l'indisponibilité de votre véhicule, comme la location d'un véhicule de remplacement. L'assureur de la personne reconnue responsable de l'accident peut également vous indemniser dans le cadre de sa garantie responsabilité civile . Pour bénéficier de cette indemnisation, vous devrez prouver que vous avez bien subi un préjudice du fait de l'indisponibilité de votre véhicule (facture de location par exemple). L'indemnisation peut être calculée sur la base d'un forfait ou du coût réel de location d'un véhicule de remplacement.

    — Accident de la vie courante : indemnisation par l'assurance · Qui indemnise un accident de la vie courante ?
    L’indemnisation dépend de l’existence ou non d’un responsable. Absence de tiers responsable Si aucun responsable n’est identifié, vous pouvez être indemnisé si vous avez souscrit une assurance personnelle couvrant ce type de risque, comme une garantie accidents de la vie (GAV). Exemple Vous vous blessez seul en tombant chez vous. Si vous avez souscrit une GAV, vous pouvez être indemnisé selon les conditions prévues au contrat. Accident causé par un tiers identifié Si une personne est responsable de l’accident, c’est elle ou son assurance responsabilité civile qui doit vous indemniser. Le principe applicable est celui de la responsabilité civile, qui impose à toute personne de réparer les dommages qu’elle cause à autrui. Exemple Un cycliste vous percute et vous blesse. Son assurance responsabilité civile peut prendre en charge votre indemnisation.

    — Accident sous l'effet d'alcool ou de drogue : quelles conséquences sur l'assurance ? · Indemnisation par l'assurance du responsable
    Si vous êtes passager, piéton ou conducteur d’un autre véhicule et que vous n’êtes pas responsable de l’accident, l’assurance responsabilité civile du conducteur fautif couvrira vos dommages corporels et matériels. Même si une victime était sous l’emprise de l’alcool ou de drogues au moment de l’accident (par exemple, un passager), elle peut tout de même bénéficier de certaines garanties, comme la protection juridique, si sa responsabilité n’est pas engagée.

    ### Code des assurances

    — Annexe art. A211-11
    Notice destinée aux victimes d'accidents de la circulation mettant en cause un véhicule terrestre à moteur Les informations suivantes ont pour but de vous expliquer ce que vous devez entreprendre et comment vous serez indemnisé. Elles ont été volontairement limitées à l'essentiel. Pour en savoir plus, il vous faut consulter : -la loi n° 85-677 du 5 juillet 1985 publiée au Journal officiel du 6 juillet 1985 ; -le décret n° 86-15 du 6 janvier 1986 publié au Journal officiel du 7 janvier 1986. La loi du 5 juillet 1985 a amélioré la situation des victimes d'accident de la circulation dans lequel est impliqué un véhicule terrestre à moteur, ainsi que ses remorques ou semi-remorques, à l'exception des chemins de fer et des tramways circulant sur des voies qui leur sont propres : -les cas de non-indemnisation sont désormais limités ; -une offre d'indemnité doit être faite par l'assureur dans un délai de huit mois en cas d'accident corporel. Qui a droit à indemnisation ? Pour les dommages corporels : -les passagers, piétons et cyclistes victimes, sauf lorsque la victime a : -recherché volontairement son dommage ; -commis une faute inexcusable, cause exclusive de l'accident. Toutefois, cette faute ne peut être opposée à la victime si elle est âgée de moins de seize ans ou de plus de soixante-dix ans ou encore si elle est atteinte d'une incapacité permanente ou d'une invalidité au moins égale à 80 % ; -les conducteurs de véhicule terrestre à moteur, sauf lorsqu'ils sont responsables de l'accident (la faute du conducteur peut en effet limiter voire exclure son droit à indemnisation). Pour les dommages matériels : -toutes les victimes dans la mesure où elles ne sont pas responsables de l'accident. Attention.-Même si vous êtes indemnisé de vos dommages, vous pouvez être tenu de réparer ceux que vous avez causés à autrui si vous êtes responsable. Comment se déroule l'indemnisation ? -l'assureur du responsable prend contact avec vous ; -vous le renseignez ; -vous vous soumettez à un examen médical ;
