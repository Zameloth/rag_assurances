        Si votre assureur ne respecte pas ces délais, vous pouvez :
        1. **Le relancer** pour obtenir des explications sur le retard.
        2. **Saisir le médiateur de l'assurance** en cas de désaccord persistant (gratuit et sans obligation de recourir à un avocat).
