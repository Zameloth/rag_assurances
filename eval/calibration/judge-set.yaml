    ### Fiches service-public.fr

    — Faut-il une assurance pour conduire une voiture sans permis ?
    Propriétaire d'une voiture sans permis : quelle assurance est obligatoire ? Si vous êtes propriétaire d'une voiture sans permis, vous devez l'assurer au minimum avec la garantie responsabilité civile (dite assurance au tiers ). Cette garantie permet que l'assurance indemnise les tiers à qui vous pourriez causer un préjudice. À noter Les conducteurs de voiturettes ne bénéficient pas du système de bonus/malus appliquée aux conducteurs de voiture classique. Location d'une voiture sans permis : que vérifier en matière d'assurance ? Si vous louez une voiture sans permis en location de courte durée , vous devez vous assurer que l'agence de location l'a bien assurée avant de prendre le volant. Si vous louez une voiture sans permis en location longue durée , le contrat doit préciser qui prend en charge l’assurance du véhicule. Si l’assurance n’est pas incluse par le loueur, vous devrez souscrire vous-même au minimum une garantie responsabilité civile. Quelle garantie supplémentaire peut être souscrite pour conduire une voiture sans permis ? Si vous souhaitez également être indemnisé en cas d'accident, vous devez souscrire des garanties supplémentaires, telles que : Dommages tous accidents Vol et incendie Bris de glace Assistance 0 km Garantie du conducteur. Quelles sont les sanctions en cas d'absence d'assurance d'une voiture sans permis ? Le fait de conduire une voiture sans permis non assurée est un délit . Les sanctions encourues sont les suivantes : Amende pouvant aller jusqu’à 3 750 € . Suspension du droit de conduire certains véhicules Travaux d’intérêt général Immobilisation ou confiscation du véhicule. En cas de première infraction, la sanction peut être remplacée par une amende forfaitaire de 500 € .

    — Conclusion d'un contrat d'assurance auto ou moto · Quelles sont les sanctions encourues quand on n'a pas d'assurance automobile ?
    Le fait de mettre en circulation un véhicule terrestre à moteur sans l'avoir assuré est un délit puni par une amende de 3 750 € . En fonction des circonstances, une ou plusieurs des peines complémentaires suivantes peuvent être appliquées en plus : Travaux d'intérêt général Jours-amendes (amendes dont le montant est fixé par jour) Suspension du permis de conduire (jusqu'à 3 ans) Annulation du permis de conduire et l'interdiction de le repasser pendant un certain temps (3 ans au plus) Interdiction de conduire certains véhicules, même s'ils ne nécessitent pas le permis de conduire Obligation d'accomplir à ses frais un stage de sensibilisation à la sécurité routière Immobilisation et/ou confiscation du véhicule avec lequel l'infraction a été commise. Vous serez seulement condamné à l'amende forfaitaire de 500 € si l'infraction a été constatée par un procès-verbal électronique et que vous n'avez pas déjà été condamné par le passé pour absence d'assurance. Dans ce cas, le paiement de l'amende dans les délais met fin aux poursuites.

    — Assurance auto obligatoire ou "au tiers" · Quelles sont les sanctions en cas d'absence d’assurance automobile ?
    Le fait de mettre en circulation un véhicule terrestre à moteur sans l'avoir assuré est un délit puni par une amende de 3 750 € . En fonction des circonstances, une ou plusieurs des peines complémentaires suivantes peuvent être appliquées en plus : Travaux d'intérêt général Jours-amendes (amendes dont le montant est fixé par jour) Suspension du permis de conduire (jusqu'à 3 ans) Annulation du permis de conduire et l'interdiction de le repasser pendant un certain temps (3 ans au plus) Interdiction de conduire certains véhicules, même s'ils ne nécessitent pas le permis de conduire Obligation d'accomplir à ses frais un stage de sensibilisation à la sécurité routière Immobilisation et/ou confiscation du véhicule avec lequel l'infraction a été commise. Vous serez seulement condamné à l'amende forfaitaire de 500 € si l'infraction a été constatée par un procès-verbal électronique et que vous n'avez pas déjà été condamné par le passé pour absence d'assurance. Dans ce cas, le paiement de l'amende dans les délais met fin aux poursuites.

    — Un véhicule doit-il être assuré même s'il n'est pas utilisé ? · Véhicule qui n'est plus en état de circuler
    Si votre véhicule n'est plus en état de circuler, vous n'êtes pas obligé de l'assurer. Mais, attention, le véhicule qui n'est plus en état de circuler n'est pas juste le véhicule qui est tombé en panne. Il s'agit du véhicule auquel il manque les éléments essentiels pour pouvoir rouler, à savoir les roues, la batterie et le réservoir de carburant. Si vous n'avez pas assuré votre véhicule inutilisé et qu'il y a un contrôle de police, vous devez apporter la preuve qu'il n'est plus en état de circuler. Le fait de mettre en circulation un véhicule terrestre à moteur sans l'avoir assuré est un délit puni par une amende de 3 750 € . En fonction des circonstances, une ou plusieurs des peines complémentaires suivantes peuvent être appliquées en plus : Travaux d'intérêt général Jours-amendes (amendes dont le montant est fixé par jour) Suspension du permis de conduire (jusqu'à 3 ans) Annulation du permis de conduire et l'interdiction de le repasser pendant un certain temps (3 ans au plus) Interdiction de conduire certains véhicules, même s'ils ne nécessitent pas le permis de conduire Obligation d'accomplir à ses frais un stage de sensibilisation à la sécurité routière Immobilisation et/ou confiscation du véhicule avec lequel l'infraction a été commise. Vous serez seulement condamné à l'amende forfaitaire de 500 € si l'infraction a été constatée par un procès-verbal électronique et que vous n'avez pas déjà été condamné par le passé pour absence d'assurance. Dans ce cas, le paiement de l'amende dans les délais met fin aux poursuites.

    — Faut-il une assurance pour conduire une voiture sans permis ?
    Oui , l'assurance est obligatoire pour une voiture sans permis (également appelée voiturette à 2 places) comme pour tout autre véhicule terrestre à moteur qui circule sur la voie publique. L'obligation d'assurance permet que les victimes des accidents impliquant ces véhicules puissent être indemnisées.

    — Un véhicule doit-il être assuré même s'il n'est pas utilisé ? · Véhicule en état de circuler
    À noter Un véhicule immatriculé reste soumis à l'obligation d'assurance tant qu’il n’a pas été formellement déclaré retiré de la circulation auprès de l’administration (via un certificat de retrait). Le simple fait de ne plus l'utiliser ne suffit pas. Si vous êtes contrôlé à bord d'un véhicule qui n'est pas assuré, ou si votre véhicule stationné est constaté en état de non-assurance, vous risquez une amende pouvant aller jusqu'à 3 750 € .

    — Faut-il assurer un véhicule de collection ?
    Un véhicule de collection , c'est-à-dire un véhicule qui a plus de 30 ans et ne roule en général que de façon occasionnelle, doit être assuré comme tous les véhicules terrestres à moteur mis en circulation. Ainsi, la souscription à une assurance responsabilité civile est obligatoire . Vous pouvez aussi souscrire des garanties supplémentaires (dégâts matériels ou vol par exemple). Comme le véhicule de collection ne roule en général que de façon occasionnelle, la cotisation d'assurance est moins élevée que pour un véhicule classique . De plus, certains assureurs proposent des contrats très avantageux réservés à ce type de véhicules. Il peut néanmoins arriver que l'assureur vous impose d'assurer en même temps que le véhicule de collection un autre véhicule, plus récent, pour un usage quotidien. L'assureur peut aussi vous imposer des conditions plus restrictives pour l'assurance du véhicule de collection. Il peut par exemple exiger que le conducteur ait plus de 21 ans et/ou qu'il n'ait pas été responsable d'accident pendant les 2 années qui précèdent la souscription du contrat. À noter Le fait de rouler sans assurance est un délit puni d’une amende de 3 750 € d’une confiscation du véhicule ainsi que d’un retrait temporaire du permis de conduire.

    ### Code des assurances

    — L211-26
    Les dispositions du code de la route réprimant la conduite d'un véhicule terrestre à moteur sans être couvert par une assurance garantissant sa responsabilité civile conformément aux dispositions de l'article L. 211-1 du présent code sont reproduites ci-après : " Art. L. 324-2-I.-Le fait, y compris par négligence, de mettre ou de maintenir en circulation un véhicule terrestre à moteur ainsi que ses remorques ou semi-remorques sans être couvert par une assurance garantissant sa responsabilité civile conformément aux dispositions de l'article L. 211-1 du code des assurances est puni de 3 750 euros d'amende. II.-Toute personne coupable de l'infraction prévue au présent article encourt également les peines complémentaires suivantes : 1° La peine de travail d'intérêt général, selon les modalités prévues à l'article 131-8 du code pénal et selon les conditions prévues aux articles 131-22 à 131-24 du même code ; 2° La peine de jours-amende dans les conditions fixées aux articles 131-5 et 131-25 du code pénal ; 3° La suspension, pour une durée de trois ans au plus, du permis de conduire, cette suspension ne pouvant pas être limitée à la conduite en dehors de l'activité professionnelle ; 4° L'annulation du permis de conduire avec interdiction de solliciter la délivrance d'un nouveau permis pendant trois ans au plus ; 5° L'interdiction de conduire certains véhicules terrestres à moteur, y compris ceux pour la conduite desquels le permis de conduire n'est pas exigé, pour une durée de cinq ans au plus ; 6° L'obligation d'accomplir, à ses frais, un stage de sensibilisation à la sécurité routière ; 7° La confiscation du véhicule dont le condamné s'est servi pour commettre l'infraction, s'il en est le propriétaire. III.-L'immobilisation peut être prescrite dans les conditions prévues aux articles L. 325-1 à L. 325-3. "
