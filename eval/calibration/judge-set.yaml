- golden_id: gs-032
  archetype: dropped_expected_point
  question: Est-ce que mon assurance habitation couvre automatiquement les dégâts si ma maison est inondée
    après de grosses pluies ?
  expected_points:
  - Votre assurance habitation ne couvre pas automatiquement les dégâts d’inondation après de grosses
    pluies sans la reconnaissance officielle d’un état de catastrophe naturelle.
  - La garantie catastrophe naturelle s’applique uniquement si vous avez souscrit une assurance multirisque
    habitation (ou un contrat couvrant les dommages aux biens).
  - Un arrêté interministériel doit reconnaître l’état de catastrophe naturelle dans votre commune pour
    que l’indemnisation soit possible.
  retrieved_citation_ids:
  - L125-1
  context: |-
    ### Fiches service-public.fr

    — Assurance dégâts des eaux · Quels sont les risques couverts par l'assurance dégât des eaux ?
    L'assurance dégâts des eaux couvre les risques liés à l'action de l'eau : dommages résultant de fuite, de rupture de canalisation, de débordement (d'une baignoire ou d'un lave-linge par exemple), etc. Les infiltrations d'eau (par exemple par la toiture, les murs ou les fenêtres) peuvent être couvertes par l'assurance dégâts des eaux si elles résultent d'un événement soudain et accidentel, comme une forte pluie ou une tempête. Elles sont généralement exclues lorsqu'elles sont dues à un manque d'entretien ou à la vétusté des installations. Les assureurs peuvent prévoir dans le contrat que certains risques liés à l'action de l'eau ne seront pas couverts. Par exemple, frais de réparation des appareils, installations ou bâtiments qui sont à l’origine des dommages causés par les eaux. Il est donc important de vérifier dans votre contrat s'il y a des dommages non couverts. À savoir L'assurance contre les dégâts des eaux est comprise dans l'assurance habitation, qui est obligatoire pour le locataire et facultative pour le propriétaire qui vit dans son propre logement.

    — Catastrophe naturelle ou technologique : indemnisation par l’assurance
    Certains événements exceptionnels, comme une inondation ou un accident industriel majeur, peuvent provoquer des dégâts importants dans les habitations et les biens. Dans ces situations, votre assurance peut vous indemniser sous certaines conditions. Comment fonctionne cette indemnisation et dans quels cas s’applique-t-elle ? Nous vous présentons les informations à connaître.

    — Assurance dégâts des eaux
    Vous êtes victime d’un dégât des eaux dans votre logement ? La première étape consiste à limiter les dommages en identifiant et stoppant la fuite , puis à informer rapidement votre assurance. Si vous disposez d’une assurance habitation, vous devez déclarer le sinistre dans les 5 jours ouvrés suivant sa découverte. Comment déclarer le sinistre et obtenir une indemnisation ? Nous vous présentons les informations à connaître.

    — Catastrophe naturelle ou technologique : indemnisation par l’assurance · Qu'est-ce que la garantie catastrophe naturelle ?
    La garantie catastrophe naturelle permet d’être indemnisé pour les dommages matériels directs causés par un phénomène naturel d’intensité anormale (inondation, sécheresse, glissement de terrain, avalanche, tremblement de terre, etc.). Cette garantie ne peut pas être souscrite seule. Elle est automatiquement incluse dans les contrats d’assurance couvrant les dommages aux biens, notamment les contrats multirisques habitation et certains contrats d’assurance automobile. Un assureur ne peut pas refuser d’accorder cette garantie lorsque vous souscrivez un contrat couvrant les dommages aux biens.

    — Faut-il assurer ses appareils portables (téléphone, tablette, ordinateur...) ? · L’assurance habitation couvre-t-elle les appareils électroniques ?
    Votre assurance habitation peut couvrir certains appareils électroniques en cas : de vol avec effraction à votre domicile, de dommages causés par un incendie ou un dégât des eaux. La couverture ne s’applique généralement pas : aux casses accidentelles, aux vols hors domicile, aux appareils transportés en dehors du logement (sauf garantie spécifique). Les garanties varient selon le contrat.

    — Assurance habitation : qu'est-ce que la garantie responsabilité civile ? · La responsabilité civile couvre-t-elle les locations saisonnières ?
    Non, pas automatiquement. La responsabilité civile habitation classique est prévue pour couvrir les dommages causés dans le cadre de votre vie privée , en tant qu’occupant ou propriétaire du logement. Or, louer votre logement (ou une chambre) sur Airbnb ou toute autre plateforme constitue une activité de location , parfois assimilée à une activité commerciale ou para-hôtelière selon les conditions. C’est pour cette raison que la plupart des assurances habitation n’incluent pas d’office la couverture des dommages causés par des locataires de passage ou à des tiers dans le cadre d’une location de courte durée. De ce fait, Si un voyageur louant un logement Airbnb provoque un incendie, un dégât des eaux, ou un dommage aux voisins, votre assurance habitation peut refuser d’indemniser si le contrat exclut les locations saisonnières. Si vous êtes propriétaire occupant et que vous louez ponctuellement une chambre, certains assureurs acceptent d’étendre la garantie via une option spécifique (souvent appelée “garantie villégiature”, “garantie location meublée”, ou “extension location saisonnière”). Si vous louez fréquemment, votre assureur peut exiger une assurance dédiée , car l’usage du logement devient assimilé à une activité professionnelle ou commerciale.

    — Assurance habitation : risque incendie ou explosion · Que se passe-t-il si le logement est inhabitable à la suite de l'incendie ?
    Dans le cas où l'incendie ou l'explosion a entraîné des dégâts qui rendent votre logement inhabitable, l'assurance peut prendre en charge votre hébergement d'urgence si le contrat le prévoit. Lorsque les travaux de réparation doivent durer longtemps, l'assurance peut aussi prendre en charge votre relogement si cela est prévu dans le contrat. Certains contrats prévoient une indemnisation forfaitaire pour les frais de relogement, d’autres un remboursement sur présentation de justificatifs. Il est donc conseillé de vérifier les plafonds et la durée maximale de prise en charge indiqués dans votre contrat.

    ### Code des assurances

    — L125-1
    Les contrats d'assurance, souscrits par toute personne physique ou morale autre que l'Etat et garantissant les dommages d'incendie ou tous autres dommages à des biens situés en France, ainsi que les dommages aux corps de véhicules terrestres à moteur, ouvrent droit à la garantie de l'assuré contre les effets des catastrophes naturelles, dont ceux des affaissements de terrain dus à des cavités souterraines et à des marnières sur les biens faisant l'objet de tels contrats. En outre, si l'assuré est couvert contre les pertes d'exploitation, cette garantie est étendue aux effets des catastrophes naturelles, dans les conditions prévues au contrat correspondant. Sont considérés comme les effets des catastrophes naturelles, au sens du présent chapitre, les dommages matériels directs non assurables ayant eu pour cause déterminante l'intensité anormale d'un agent naturel ou également, pour les mouvements de terrain différentiels consécutifs à la sécheresse et à la réhydratation des sols, la succession anormale d'événements de sécheresse d'ampleur significative, lorsque les mesures habituelles à prendre pour prévenir ces dommages n'ont pu empêcher leur survenance ou n'ont pu être prises. Sont également considérés comme les effets des catastrophes naturelles, au sens du présent chapitre, et pris en charge par le régime de garantie associé les frais de relogement d'urgence des personnes sinistrées dont la résidence principale est rendue impropre à l'habitation pour des raisons de sécurité, de salubrité ou d'hygiène qui résultent de ces dommages matériels directs non assurables ayant eu pour cause déterminante l'intensité anormale d'un agent naturel ou également, pour les mouvements de terrain différentiels consécutifs à la sécheresse et à la réhydratation des sols, la succession anormale d'événements de sécheresse d'ampleur significative. Les modalités de prise en charge de ces frais sont fixées par décret.
