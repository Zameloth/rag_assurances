  question: Est-ce que mon assurance auto française marche aussi si je vais en vacances en Espagne ?
  expected_points:
  - Votre assurance auto responsabilité civile française couvre automatiquement l'Espagne, comme tous
    les pays de l'Union européenne.
  retrieved_citation_ids: []
  context: |-
    ### Fiches service-public.fr

    — Un étranger qui vient en France en voiture est-il couvert par son assurance ?
    Oui, mais la couverture dépend du pays d’immatriculation du véhicule. En effet, la validité de l’assurance automobile en France repose sur des accords internationaux.

    — Est-on couvert par l'assurance automobile pendant un voyage à l'étranger ?
    Oui, votre assurance auto peut vous couvrir lors d'un déplacement à l'étranger. Mais, avant le départ, vous devez vérifier votre contrat ou interroger votre assureur pour savoir dans quels pays vous êtes couvert. La situation est différente pour un voyage en Europe et un voyage hors d'Europe. Nous vous présentons les informations à connaître.

    — Est-on couvert par l'assurance automobile pendant un voyage à l'étranger ? · Quelles vérifications faire avant de partir à l'étranger avec son propre véhicule ?
    Validité territoriale de l'assurance L'assurance auto responsabilité civile souscrite en France couvre tous les pays de l'Union européenne. Cette assurance couvre également les autres pays pour lesquels les bureaux nationaux de tous les pays de l'Union européenne se portent individuellement garants du règlement des sinistres survenus sur leur territoire. Pour connaître la liste des pays non membres de l'Union européenne qui sont couverts par votre assurance véhicule, vous devez demander à votre assureur de vous délivrer une carte internationale d'assurance automobile. Il y a sur ce document la liste des pays dans lesquels votre assurance auto vous couvre. Si le nom d'un pays est rayé dans cette liste, cela signifie que votre assurance ne fonctionne pas dans ce pays. Si vous souhaitez malgré tout vous rendre dans un pays où votre assurance ne fonctionne pas, vous devez souscrire localement une assurance spécifique. Risques couverts à l'étranger Les risques couverts à l'étranger dépendent des garanties que vous avez souscrites. Si votre véhicule est garanti uniquement pour la responsabilité civile , vous ne serez couvert que pour les dommages que votre véhicule peut causer aux tiers. Si vous avez souscrit des garanties supplémentaires (par exemple dans la formule "tous risques" ), il est possible que leur application soit limitée en fonction du pays visité. Il faut donc vérifier auprès de votre assureur les garanties qui s'appliquent et celles qui sont limitées dans votre pays de destination. Vous devez particulièrement vérifier si, en cas de vol ou d'accident du véhicule, l'assurance prend en charge les frais suivants : Frais de remorquage du véhicule Frais de rapatriement des passagers, voire du véhicule Frais d’hébergement pendant la durée des réparations Paiement d'un chauffeur pour rapatrier le véhicule et ses occupants

    — Un étranger qui vient en France en voiture est-il couvert par son assurance ?
    Nous vous présentons les règles à connaître en fonction du pays : L'assurance d'un véhicule immatriculé dans un pays européen marche-t-elle en France ? Si vous venez en France avec votre véhicule immatriculé dans un des pays de l'Union européenne ou dans un pays assimilé, vous serez couvert par votre assurance auto étrangère. Vous serez couvert au minimum avec la garantie obligatoire responsabilité civile , c'est-à-dire pour les dommages que votre véhicule pourrait causer aux autres.

    — Un étranger qui vient en France en voiture est-il couvert par son assurance ? · Pays participant au système de la « carte verte »
    Pendant combien de temps l'assurance souscrite dans un pays qui participe au système de la carte verte vous couvre-t-elle en France ? Votre assurance étrangère peut vous couvrir pendant la période où vous avez le droit d'utiliser votre voiture avec sa plaque étrangère, c'est-à-dire 6 mois . Si vous séjournez en France pendant plus de 6 mois, vous serez considéré comme résident. Dans ce cas, vous serez aussi obligé d'immatriculer votre voiture et de souscrire une assurance auto en France.

    — Un étranger qui vient en France en voiture est-il couvert par son assurance ?
    Trois situations sont possibles : Le véhicule est immatriculé dans un pays européen ou assimilé en matière d’assurance automobile Le véhicule est immatriculé dans un pays participant au système de la « carte verte » , c’est-à-dire un accord entre de nombreux pays qui reconnaissent mutuellement les assurances auto de leurs ressortissants Le véhicule est immatriculé dans un autre pays (hors accords). Règles d’assurance pour un véhicule étranger qui circule en France Pays L’assurance étrangère est-elle valable en France ? La carte verte est-elle requise ? Conditions spécifiques États de l’ Union européenne + pays assimilés (accord multilatéral) Exemple : Andorre, Bosnie-Herzégovine, Grande-Bretagne, Islande, Liechtenstein, Monténégro, Norvège, Serbie, Suisse Oui Non, la plaque d'immatriculation suffit comme preuve Vous avez une couverture automatique en responsabilité civile. Vous pouvez bénéficier de garanties optionnelles selon le contrat souscrit. Pays participant au système de la carte verte Exemple : Turquie, Maroc, Tunisie, Ukraine, Israël, Albanie Oui Oui, obligatoire à bord du véhicule Vous devez présenter la carte verte comme preuve d’assurance. Il est recommandé de vérifier si vous bénéficiez de garanties optionnelles. Pays hors carte verte et hors UE/assimilé Exemple : Afghanistan, Syrie, Éthiopie, Corée du Nord Non Non Vous devez souscrire obligatoirement une assurance frontière à l’entrée en France. Elle correspond à la responsabilité civile minimum. Elle est renouvelable une fois (30 à 90 jours). Cas particulier du véhicule immatriculé hors UE ,mais entrant depuis un pays UE Exemple : véhicule immatriculé au Liban mais entrant depuis l'Allemagne, Monaco, Vatican, Saint-Marin Variable Se renseigner selon pays d’origine et accords bilatéraux (c’est à dire si la France a signé un accord avec le pays où le véhicule a été immatriculé) Vous devez vous renseigner précisément selon le pays. Dans le doute, il est recommandé de souscrire une assurance frontière.

    — Un étranger qui vient en France en voiture est-il couvert par son assurance ? · Pays participant au système de la « carte verte »
    Mais si vous avez souscrit des garanties optionnelles (par exemple dégâts matériels, vol, incendie), certaines de ces garanties pourraient s'appliquer en France. Vous devez vérifier avant d'entamer votre voyage auprès de votre assureur les couvertures qui s'appliquent en France et, et les cas de limitation de garanties ou d'exclusion de garantie. Si vous avez souscrit la garantie vol ou la garantie assistance, il faut vérifier si en cas de vol ou d'accident du véhicule, l'assurance prend en charge les dépenses suivantes :

    — Un étranger qui vient en France en voiture est-il couvert par son assurance ? · Pays européen ou assimilé
    Pendant combien de temps l'assurance d'un véhicule immatriculé dans un pays européen marche-t-elle en France ? Vous pouvez utiliser votre assurance étrangère en France pendant 6 mois maximum . Si vous séjournez en France pendant plus de 6 mois, vous serez considéré comme résident de ce pays et vous serez obligé d'immatriculer votre voiture en France. Une fois que le véhicule est immatriculé en France, il est considéré comme ayant son lieu de stationnement habituel sur ce territoire. Dans ce cas, vous serez obligé de souscrire une assurance auto en France.
