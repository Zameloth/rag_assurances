- golden_id: gs-015
  archetype: fabricated_citation
  question: Est-ce que je peux vraiment forcer une assurance à me couvrir si elles me refusent toutes
    ?
  expected_points:
  - Toute compagnie d’assurance peut être contrainte par le Bureau central de tarification (BCT) à vous
    couvrir pour la garantie obligatoire de responsabilité civile.
  - La saisine du BCT est possible si aucune assurance n’accepte de vous assurer pour votre véhicule.
  retrieved_citation_ids:
  - L125-6
  - L215-1
  context: |-
    ### Fiches service-public.fr

    — Modification du contrat d'assurance auto ou moto · Modification du contrat d'assurance auto suite à une nouvelle obligation légale
    Les pouvoirs publics peuvent décider d'obliger tous les assurés à s'assurer contre certains risques et, parallèlement, d'obliger tous les assureurs à couvrir ces risques. Dans cette hypothèse, l'assureur a le droit de vous imposer une modification du contrat qui ajoute une nouvelle garantie obligatoire, et qui augmente la cotisation. L'assureur doit vous envoyer un avenant avec les nouvelles conditions du contrat.

    — Que faire si les assurances refusent d'assurer un véhicule ?
    Les assurances peuvent refuser d'assurer votre véhicule pour l'une des raisons suivantes : Profil à risque (jeune conducteur, malus élevé) Voiture jugé trop puissant ou à risque Antécédents de sinistres Condamnation pour conduite d'un véhicule sous l'emprise de substances interdites (alcool ou de stupéfiant) Résiliation pour non paiement. Si vous êtes dans l'une des situations suivantes, vous pouvez faire appel au BTC pour obtenir la couverture minimale obligatoire.

    — Accident sous l'effet d'alcool ou de drogue : quelles conséquences sur l'assurance ? · Le conducteur dont le contrat d'assurance a été résilié suite à un accident causé sous l'effet d'alcool ou de drogue peut-il changer d'assureur ?
    Oui, vous pouvez changer d'assureur. Toutefois, le fait d'être inscrit dans le fichier des résiliations automobiles en tant que conducteur à risque peut entraîner les situations suivantes : Refus d'assurance Augmentation importante de la prime Période probatoire. En cas de difficulté, vous pouvez vous rapprocher du bureau central de tarification (BTC) . Il s'agit d'un organisme indépendant dont le rôle est de garantir que tout conducteur puisse souscrire à l'assurance responsabilité civile obligatoire. Pour solliciter son intervention, vous devez lui adresser une demande écrite en joignant la preuve du refus. Un modèle de demande est disponible : Saisir le Bureau central de tarification (BCT) en cas de refus d'assurance de son véhicule Institut national de la consommation (INC) Le BCT désigne un assureur qui sera tenu de vous proposer une couverture en responsabilité civile, et détermine le montant de la prime que vous devrez payer. À noter L'intervention du BCT se limite à la garantie de responsabilité civile obligatoire. Les garanties facultatives (telles que le vol, l'incendie ou les dommages tous accidents) ne sont pas concernées.

    — Que faire si les assurances refusent d'assurer un véhicule ? · En cas de refus de l'assureur ou en cas d'absence de réponse : écrire au BCT
    Si la société refuse de vous assurer pour la garantie obligatoire responsabilité civile ou si elle ne vous répond pas dans les 15 jours à compter de la réception de votre demande, vous pouvez saisir le BCT. Il faut envoyer au BTC un courrier par lettre recommandée avec accusé de réception ou par envoi recommandé électronique. Vous pouvez utiliser le modèle de lettre suivant : Saisir le Bureau central de tarification (BCT) en cas de refus d'assurance de son véhicule Institut national de la consommation (INC) Le courrier doit être accompagné des documents suivants : 2 ème exemplaire complété du document proposition d'assurance Accusé de réception par l'assurance du courrier que vous lui avez envoyé Devis fourni par la compagnie d'assurance et sa lettre de refus de vous assurer (si ces documents vous ont été envoyés) Photocopie de la carte grise et de votre permis de conduire Relevé d'information de l'ancienne compagnie d'assurance Dernier avis d'échéance de votre contrat En cas de condamnation pour conduite sous l'emprise de substances interdites, copie de la décision judiciaire. Le BTC intervient uniquement pour la garantie obligatoire de responsabilité civile. Les autres garanties (vol, incendie, bris de glace, tous risques) sont laissées à l'appréciation de l'assureur. Le BCT fixe le montant de la cotisation et vous en informe. Le BCT informe également l'assureur. La décision est prise dans un délai d'environ 2 mois. Vous devez répondre au BCT pour lui signaler votre accord, par lettre recommandée avec accusé de réception. Vous devrez alors payer la cotisation à la société d'assurance qui va assurer votre voiture.

    — Que faire si les assurances refusent d'assurer un véhicule ?
    Si aucune compagnie d'assurance ne veut assurer votre véhicule, vous pouvez saisir le Bureau central de tarification (BCT). Cet organisme peut contraindre une compagnie à vous assurer pour la garantie obligatoire de responsabilité civile. Dans ce cas, c'est le BCT qui fixe lui-même le tarif du contrat. L'assureur peut refuser de vous proposer d'autres garanties en dehors de l'assurance obligatoire.

    — Assurance : indemnisation du vol ou de la tentative de vol d'un véhicule · Que faire si l'assureur refuse d'indemniser un véhicule en cas de vol ou de tentative de vol ?
    Si votre assureur refuse d'indemniser votre véhicule en cas de vol ou de tentative de vol, plusieurs recours sont possibles .

    ### Code des assurances

    — L125-6
    Lorsqu'un assuré s'est vu refuser par une entreprise d'assurance, en raison de l'importance du risque de catastrophes naturelles auquel il est soumis, la souscription d'un des contrats mentionnés à l'article L. 125-1 du présent code, il peut saisir le bureau central de tarification, qui impose à l'entreprise d'assurance concernée la souscription du contrat demandé comprenant la garantie contre les effets des catastrophes naturelles. Lorsque le risque présente une importance ou des caractéristiques particulières, le bureau central de tarification peut demander à l'assuré de lui présenter, dans les mêmes conditions, un ou plusieurs autres assureurs afin de répartir le risque entre eux. Toute entreprise d'assurance ayant maintenu son refus de garantir un assuré dans les conditions fixées par le bureau central de tarification est considérée comme ne fonctionnant plus conformément à la réglementation en vigueur et encourt le retrait de l'agrément administratif prévu aux articles L. 321-1 ou L. 321-7 à L. 321-9 . Est nulle toute clause des traités de réassurance tendant à exclure le risque de catastrophe naturelle de la garantie de réassurance en raison des conditions d'assurance fixées par le bureau central de tarification. Le préfet ou le président de la caisse centrale de réassurance peuvent saisir le bureau central de tarification lorsque les conditions dans lesquelles un bien ou une activité bénéficie de la garantie prévue de l'article L. 125-1 leur paraissent injustifiées eu égard au comportement de l'assuré ou à l'absence de toute mesure de précaution de nature à réduire la vulnérabilité de ce bien ou de cette activité. Le bureau central de tarification fixe des abattements spéciaux dans les conditions prévues au cinquième alinéa.

    — L215-1
    Toute personne assujettie à l'obligation d'assurance énoncée au g de l'article 7 de la loi n° 89-462 du 6 juillet 1989 tendant à améliorer les rapports locatifs et portant modification de la loi n° 86-1290 du 23 décembre 1986 ou tout bailleur souscrivant une assurance habitation pour le compte d'un locataire dans les conditions définies au même g qui, ayant sollicité la souscription d'un contrat auprès d'une entreprise d'assurance couvrant en France les risques dont elle doit répondre en sa qualité de locataire, se voit opposer un refus peut saisir le bureau central de tarification prévu à l'article L. 212-1. Le bureau central de tarification fixe le montant de la prime moyennant laquelle l'entreprise d'assurance intéressée est tenue de garantir le risque qui lui a été proposé. Il peut, dans les conditions fixées par décret en Conseil d'Etat, déterminer le montant d'une franchise qui reste à la charge de l'assuré. Toute entreprise d'assurance qui maintient son refus de garantir le risque dont la prime a été fixée par le bureau central de tarification est considérée comme ne fonctionnant plus conformément à la réglementation en vigueur. Elle encourt, selon le cas, soit le retrait des agréments prévus aux articles L. 321-1 , L. 321-7, L. 321-8 ou L. 321-9 , soit les sanctions prévues à l'article L. 363-4 .
