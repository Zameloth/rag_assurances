    human_label: pass
    envelope:
      type: reponse
      explanation: |-
        Oui, dans certains cas, vous pouvez contraindre une assurance à vous couvrir pour la garantie obligatoire de responsabilité civile (assurance minimale imposée par la loi pour circuler avec un véhicule). Cela s'applique notamment si vous avez essuyé des refus d'assurance en raison de votre profil (jeune conducteur, malus élevé, antécédents de sinistres, condamnation pour conduite sous l'emprise d'alcool ou de stupéfiants, etc.).

        Pour cela, vous devez saisir le **Bureau Central de Tarification (BCT)**. Cet organisme indépendant a le pouvoir d'imposer à une compagnie d'assurance de vous proposer un contrat couvrant au moins la responsabilité civile obligatoire. Le BCT fixe également le montant de la prime que vous devrez payer. Notez que cette intervention se limite à la garantie obligatoire : les garanties facultatives (vol, incendie, dommages tous accidents, etc.) restent à la discrétion des assureurs.

        Voici les étapes à suivre :
        1. Envoyez une demande écrite au BCT (par lettre recommandée avec accusé de réception ou envoi recommandé électronique).
        2. Joignez les documents suivants :
           - Un exemplaire complété de la proposition d'assurance refusée.
           - L'accusé de réception de votre courrier envoyé à l'assureur.
           - Le devis et la lettre de refus de l'assureur (si disponibles).
           - Une photocopie de votre carte grise et de votre permis de conduire.
           - Votre relevé d'information d'assurance.
           - Votre dernier avis d'échéance de contrat.
           - En cas de condamnation pour conduite sous l'emprise de substances interdites, une copie de la décision judiciaire.
        3. Le BCT prendra une décision dans un délai d'environ 2 mois et vous informera, ainsi que l'assureur désigné, du montant de la cotisation.
        4. Vous devrez confirmer votre accord par lettre recommandée avec accusé de réception et payer la cotisation à l'assureur désigné.
      fondement_juridique:
      - article_id: L125-6
        gloss: Cet article prévoit que le Bureau Central de Tarification (BCT) peut imposer à une entreprise
          d'assurance la souscription d'un contrat couvrant les risques de catastrophes naturelles en
          cas de refus. Bien que ce cas spécifique concerne les catastrophes naturelles, le principe général
          du BCT s'applique également pour la garantie obligatoire de responsabilité civile automobile,
          comme le confirment les fiches pratiques.
