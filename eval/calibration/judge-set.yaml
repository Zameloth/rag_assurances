        En tant que piéton victime d'un accident de la route impliquant un véhicule terrestre à moteur, vous bénéficiez d'une indemnisation intégrale pour vos dommages corporels, **même si l'accident est partiellement ou entièrement de votre faute**. Cette règle est prévue par la loi du 5 juillet 1985 (dite « loi Badinter »), qui limite strictement les cas où une victime peut être privée d'indemnisation.

        Deux exceptions pourraient cependant vous exclure du droit à indemnisation :
        1. Si vous avez **volontairement provoqué l'accident** (par exemple, dans le cadre d'une tentative de suicide).
