  context: |-
    ### Code des assurances

    — L113-15-2
    Pour les contrats d'assurance couvrant les personnes physiques en dehors de leurs activités professionnelles et relevant des branches ou des catégories de contrats définies par décret en Conseil d'Etat, l'assuré peut, après expiration d'un délai d'un an à compter de la première souscription, résilier sans frais ni pénalités les contrats et adhésions tacitement reconductibles. La résiliation prend effet un mois après que l'assureur en a reçu notification par l'assuré. Le droit de résiliation prévu au premier alinéa est mentionné dans chaque contrat d'assurance. Il est en outre rappelé avec chaque avis d'échéance de prime ou de cotisation. Le droit de résiliation prévu au même premier alinéa n'est pas ouvert à l'adhérent lorsque le lien qui l'unit à l'employeur rend obligatoire l'adhésion au contrat. Lorsque le contrat est résilié dans les conditions prévues au premier alinéa, l'assuré n'est redevable que de la partie de prime ou de cotisation correspondant à la période pendant laquelle le risque est couvert, cette période étant calculée jusqu'à la date d'effet de la résiliation. L'assureur est tenu de rembourser le solde à l'assuré dans un délai de trente jours à compter de la date de résiliation. A défaut de remboursement dans ce délai, les sommes dues à l'assuré produisent de plein droit intérêts au taux légal. Pour les contrats d'assurance de personnes souscrits par un employeur ou une personne morale au profit de ses salariés ou adhérents et relevant des catégories de contrats définies par décret en Conseil d'Etat, le droit de résiliation prévu au même premier alinéa est ouvert au souscripteur.

    — L113-15-2
    Pour l'assurance de responsabilité civile automobile définie à l'article L. 211-1 et pour l'assurance mentionnée au g de l'article 7 de la loi n° 89-462 du 6 juillet 1989 tendant à améliorer les rapports locatifs et portant modification de la loi n° 86-1290 du 23 décembre 1986, le nouvel assureur effectue pour le compte de l'assuré souhaitant le rejoindre les formalités nécessaires à l'exercice du droit de résiliation dans les conditions prévues au premier alinéa du présent article. Il s'assure en particulier de la permanence de la couverture de l'assuré durant la procédure. Dans le cas où l'assuré souhaite résilier un contrat conclu pour le remboursement et l'indemnisation des frais occasionnés par une maladie, une maternité ou un accident afin de souscrire un nouveau contrat auprès d'un nouvel organisme, celui-ci effectue pour le compte de l'assuré souhaitant le rejoindre les formalités nécessaires à l'exercice du droit de résiliation dans les conditions prévues au premier alinéa du présent article. Les organismes intéressés s'assurent de l'absence d'interruption de la couverture de l'assuré durant la procédure. Un décret en Conseil d'Etat précise les modalités et conditions d'application du présent article.
