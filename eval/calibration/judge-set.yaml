- golden_id: gs-013
  archetype: fabricated_citation
  question: Si je vends ma maison avant la fin des 10 ans, est-ce que l’assurance dommages-ouvrage continue
    de couvrir les nouveaux propriétaires ?
  expected_points:
  - L’assurance dommages-ouvrage est transférée automatiquement au nouveau propriétaire en cas de vente
    du bien avant 10 ans.
  - Le nouvel acquéreur devient le bénéficiaire de la garantie et peut engager les démarches auprès de
    l’assureur en cas de sinistre.
  - La couverture reste valable jusqu’à l’expiration du délai de 10 ans à compter de la réception des
    travaux, indépendamment du changement de propriétaire.
  retrieved_citation_ids:
  - L123-3
  - L128-2
  - L242-1
  context: |-
    ### Fiches service-public.fr

    — Garantie décennale des constructeurs · Sur quelle période la garantie décennale s'applique-t-elle ?
    La garantie décennale couvre les dommages survenus après la réception des travaux par le maître d'ouvrage pendant 10 ans. Le délai démarre le lendemain de la signature du procès-verbal de réception des travaux . Attention Une action en justice contre le constructeur ne peut pas être exercée plus de 10 ans après la réception des travaux.

    — Garantie décennale des constructeurs · Qu’est-ce que la garantie décennale des constructeurs ?
    La garantie décennale assure la responsabilité du constructeur en cas de dommage apparu dans les 10 ans à compter de la réception de travaux de construction. Cette assurance protège le maître d’ouvrage et les propriétaires successifs de la construction. Elle concerne les constructions nouvelles, les travaux d'extension et de rénovation d'un bâtiment existant. Elle s’applique aux désordres dont l’importance représente un risque pour la solidité de la construction ou la rend impropre à sa destination . La garantie doit être souscrite avant le démarrage des travaux.

    — Assurance dommages-ouvrage · Quels sont les sinistres couverts par l'assurance dommages-ouvrage ?
    L'assurance dommages-ouvrage (DO) rembourse la totalité des travaux de réparation des dommages couverts par la garantie décennale des constructeurs. Elle garantit les malfaçons qui affectent la solidité de l'ouvrage et le rendent inhabitable ou impropre à l'usage auquel il est destiné (fissures importantes, effondrement de toiture...). L'assurance DO garantit les dommages apparents ou non lors de la réception de travaux . Elle couvre également les malfaçons qui compromettent la solidité des éléments d'équipement indissociables des ouvrages de viabilité, de fondation, d'ossature, de clos et de couvert. Il s'agit d'éléments dont la dépose, le démontage ou le remplacement ne peuvent s'effectuer sans détériorer la construction comme pour des canalisations encastrées, par exemple. Attention Les clauses-types prévoient que la garantie ne s'applique pas aux dommages provenant des motifs suivants : Fait intentionnel ou dol du souscripteur ou de l'assuré Effets de l'usure normale, de l'absence d'entretien ou de l'usage anormal Cause étrangère : force majeure , fait d'un tiers ou faute du maître d'ouvrage

    — Assurance habitation : en cas d'achat ou de vente d'un logement
    Lors de la vente ou de l'achat d'un logement, le contrat d'assurance habitation est automatiquement transféré du vendeur à l'acheteur. Cela évite que l'habitation reste sans assurance, même pendant une courte période. Mais l'acheteur et l'assureur ont la possibilité de résilier le contrat transféré après la vente. Les règles de résiliation et de transfert concernent toute personne quelle que soit sa nationalité et quelle que soit la durée de son séjour en France.

    — Garantie décennale des constructeurs · Qui doit souscrire la garantie décennale des constructeurs ?
    Le constructeur professionnel doit souscrire une assurance en garantie décennale. Il peut être un entrepreneur, un promoteur, un lotisseur, un maître d'œuvre, un architecte, un technicien, un bureau d'étude, un ingénieur-conseil, un artisan, un auto-entrepreneur. Il est lié au maître d'ouvrage par un contrat de louage d'ouvrage . Les constructeurs étrangers doivent justifier que leur garantie couvre la responsabilité décennale selon la loi française, pour les contrats de construction réalisés en France. Les sous-traitants sont exclus du champ d'application de la garantie décennale , car ils n'ont pas de lien direct avec le maître d'ouvrage. Ils sont cependant responsables des obligations sur lesquelles ils se sont engagés envers le constructeur. Attention Le maître d'ouvrage a l'obligation de souscrire une assurance dommages-ouvrages . Elle permet de rembourser ou d'effectuer des réparations couvertes par la garantie décennale sans rechercher les responsabilités de chacun.

    ### Code des assurances

    — L123-3
    Après l'aliénation soit de l'immeuble, soit des produits, la dénonciation du contrat faite par l'assureur à l'acquéreur ne prend effet qu'à l'expiration de l'année d'assurance en cours. Mais lorsque la prime est payable à terme, le vendeur est déchu du bénéfice du terme pour le paiement de la prime afférente à cette période.

    — L128-2
    Les contrats d'assurance souscrits par toute personne physique en dehors de son activité professionnelle et garantissant les dommages d'incendie ou tous autres dommages à des biens à usage d'habitation ou placés dans des locaux à usage d'habitation situés en France, ainsi que les dommages aux corps de véhicules terrestres à moteur, ouvrent droit à la garantie de l'assuré pour les dommages résultant des catastrophes technologiques affectant les biens faisant l'objet de ces contrats. Cette garantie s'applique également aux contrats souscrits par ou pour le compte des syndicats de copropriété, et garantissant les dommages aux parties communes des immeubles d'habitation en copropriété, ainsi qu'aux contrats souscrits par les organismes visés à l'article L. 411-2 du code de la construction et de l'habitation et garantissant les dommages aux immeubles d'habitation dont ils ont la propriété. Cette garantie couvre la réparation intégrale des dommages, dans la limite, pour les biens mobiliers, des valeurs déclarées ou des capitaux assurés au contrat. Sauf stipulations plus favorables, les indemnisations résultant de cette garantie doivent être attribuées aux assurés dans un délai de trois mois à compter de la date de remise de l'état estimatif des biens endommagés ou des pertes subies ou de la date de publication, lorsque celle-ci est postérieure, de la décision administrative prévue à l'article L. 128-1 .

    — L242-1
    Toute personne physique ou morale qui, agissant en qualité de propriétaire de l'ouvrage, de vendeur ou de mandataire du propriétaire de l'ouvrage, fait réaliser des travaux de construction, doit souscrire avant l'ouverture du chantier, pour son compte ou pour celui des propriétaires successifs, une assurance garantissant, en dehors de toute recherche des responsabilités, le paiement de la totalité des travaux de réparation des dommages de la nature de ceux dont sont responsables les constructeurs au sens de l'article 1792-1 , les fabricants et importateurs ou le contrôleur technique sur le fondement de l'article 1792 du code civil. Toutefois, l'obligation prévue au premier alinéa ci-dessus ne s'applique ni aux personnes morales de droit public, ni aux personnes morales assurant la maîtrise d'ouvrage dans le cadre d'un contrat de partenariat conclu en application de l'article 1er de l'ordonnance n° 2004-559 du 17 juin 2004 sur les contrats de partenariat, ni aux personnes morales exerçant une activité dont l'importance dépasse les seuils mentionnés au dernier alinéa de l'article L. 111-6 , lorsque ces personnes font réaliser pour leur compte des travaux de construction pour un usage autre que l'habitation. L'assureur a un délai maximal de soixante jours, courant à compter de la réception de la déclaration du sinistre, pour notifier à l'assuré sa décision quant au principe de la mise en jeu des garanties prévues au contrat. Lorsqu'il accepte la mise en jeu des garanties prévues au contrat, l'assureur présente, dans un délai maximal de quatre-vingt-dix jours, courant à compter de la réception de la déclaration du sinistre, une offre d'indemnité, revêtant le cas échéant un caractère provisionnel et destinée au paiement des travaux de réparation des dommages. En cas d'acceptation, par l'assuré, de l'offre qui lui a été faite, le règlement de l'indemnité par l'assureur intervient dans un délai de quinze jours.
