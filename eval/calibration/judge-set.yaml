- golden_id: gs-046
  archetype: fabricated_citation
  question: L'article L. 121-12 dit quoi sur le remboursement si l'autre conducteur est responsable de
    l'accident ?
  expected_points:
  - L’assureur qui a indemnisé son assuré est subrogé dans ses droits contre le tiers responsable de l’accident.
  retrieved_citation_ids:
  - L121-12
  context: |-
    ### Code des assurances

    — L121-12
    Sans préjudice du deuxième alinéa de l' article L. 121-2 , l'assureur qui a payé l'indemnité d'assurance est subrogé, jusqu'à concurrence de cette indemnité, dans les droits et actions de l'assuré contre les tiers qui, par leur fait, ont causé le dommage ayant donné lieu à la responsabilité de l'assureur. L'assureur peut être déchargé, en tout ou en partie, de sa responsabilité envers l'assuré, quand la subrogation ne peut plus, par le fait de l'assuré, s'opérer en faveur de l'assureur. Par dérogation aux dispositions précédentes, l'assureur n'a aucun recours contre les enfants, descendants, ascendants, alliés en ligne directe, préposés, employés, ouvriers ou domestiques, et généralement toute personne vivant habituellement au foyer de l'assuré, sauf le cas de malveillance commise par une de ces personnes.
  clean:
    human_label: pass
    envelope:
      type: reponse
      explanation: |-
        L'article L121-12 du Code des assurances traite de la subrogation de l'assureur. Concrètement, lorsque votre assureur vous indemnise pour un dommage causé par un tiers (par exemple, un autre conducteur responsable d'un accident), il se substitue à vous pour récupérer cette somme auprès du responsable ou de son assureur. Cela signifie que c'est l'assureur du responsable qui devra finalement rembourser votre assureur, et non vous directement qui recevez l'indemnité de votre propre assureur dans un premier temps.

        En revanche, cette subrogation ne s'applique pas si le responsable fait partie des personnes vivant habituellement à votre foyer (comme un membre de votre famille ou un employé), sauf en cas de malveillance de leur part.
