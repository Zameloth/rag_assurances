  question: Mon assureur met trop de temps à me rembourser mon dégât des eaux. Quelle autre assurance
    sera plus rapide ?
  expected_points:
  - le système ne recommande pas un assureur ou un contrat en particulier
  - l'assureur doit exécuter la prestation dans le délai prévu au contrat, une fois la proposition d'indemnisation
    acceptée (généralement 1 mois)
  - en cas de désaccord ou de retard, l'assuré peut saisir le médiateur de l'assurance puis la justice
