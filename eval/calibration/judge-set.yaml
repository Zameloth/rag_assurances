  question: Si je me fais contrôler sans assurance, est-ce que je risque vraiment de perdre mon permis
    ou de me faire confisquer ma voiture ?
  expected_points:
  - Conduire sans assurance est un délit passible d’une amende pouvant aller jusqu’à 3 750 €.
  - Le tribunal peut prononcer une suspension ou une annulation du permis de conduire, ainsi qu’une confiscation
