- golden_id: gs-054
  archetype: refusal_without_explanation
  question: Et sinon, c'est laquelle qui propose la meilleure, dans ce cas ?
  expected_points:
  - le système ne recommande pas une banque ou un assureur en particulier
  - vous êtes libre de choisir un autre assureur que celui proposé par votre banque, à condition que le
    contrat respecte le niveau de garanties exigé
  - des éléments comme le délai de carence ou le délai de franchise permettent de comparer les contrats,
    en dehors du taux
  retrieved_citation_ids: []
  context: |-
    ### Fiches service-public.fr

    — Comment obtenir un contrat d'assurance emprunteur pour un crédit immobilier ?
    Avant de vous faire une offre de crédit immobilier, l'organisme prêteur (par exemple, la banque) peut exiger que vous signiez un contrat d'assurance . L'organisme prêteur en fixe les garanties minimales (décès, invalidité...). Il réalise ensuite une estimation du coût de l'assurance de votre futur crédit. Mais vous pouvez vous adresser à un autre assureur . En général, vous devrez répondre à un questionnaire de santé avant d'obtenir une proposition d'assurance. Nous vous expliquons.

    — Comment obtenir un contrat d'assurance emprunteur pour un crédit immobilier ? · À quel assureur s'adresser pour un crédit immobilier ?
    L'organisme prêteur auquel vous demandez votre crédit immobilier peut vous proposer les contrats suivants : Contrat d'assurance emprunteur qu'il commercialise Contrat collectif d'assurance proposé par un de ses partenaires. On parle de contrat d'assurance groupe . Mais vous êtes libre de vous adresser à un autre assureur. Dans tous les cas, le contrat d'assurance que vous choisissez doit respecter les critères définis dans la fiche personnalisée que vous a remis l'organisme prêteur. À savoir Plusieurs éléments (délai de carence , délai de franchise ...) permettent de différencier les contrats d’assurance, en dehors du taux d'intérêt.

    — Comment obtenir un contrat d'assurance emprunteur pour un crédit immobilier ? · Quel contrat d'assurance demander pour un crédit immobilier ?
    L'organisme prêteur définit les caractéristiques du contrat d'assurance qu'il exige selon le type de crédit immobilier demandé (pour acheter votre résidence principale, pour faire un investissement locatif...) et selon votre statut professionnel (fonctionnaire, salarié...). Il s'agit des caractéristiques suivantes : Garanties minimum (risque de décès, risque d'invalidité...) Contenu de chaque garantie, c'est-à-dire le mode de couverture du risque (risque couvert jusqu'à la fin du prêt, ou jusqu'à un certain âge...) Hauteur à laquelle le crédit doit être assuré (à 100 % ou en partie). L'organisme prêteur fait ensuite une simulation du crédit immobilier et du contrat d'assurance qu'il pourrait vous proposer. Il vous remet alors les documents suivants : Liste des documents à fournir pour faire votre demande de crédit Fiche standardisée d'information . Cette fiche indique les caractéristiques de votre demande de crédit et les garanties minimales de l'assurance emprunteur exigée. Elle indique également le contrat d'assurance que l'organisme prêteur pourrait vous proposer et son coût approximatif (compte tenu des caractéristiques du prêt, de votre âge, des garanties envisagées...). Fiche personnalisée . Ce document définit les caractéristiques du contrat d'assurance que vous devez obtenir. Il contient les éléments indiquant à quelle hauteur le prêt doit être assuré, le type et le contenu des garanties à couvrir. Ces éléments sont définis à l'aide de 11 critères maximum pour les garanties décès, perte d'autonomie, invalidité, incapacité, et de 4 critères au maximum pour la perte d'emploi.

    — Comment obtenir un contrat d'assurance emprunteur pour un crédit immobilier ? · L'assurance emprunteur est-elle obligatoire en cas de crédit immobilier ?
    L'organisme prêteur (par exemple, la banque) auquel vous demandez un crédit immobilier peut vous imposer d'obtenir une assurance emprunteur. Dans ce cas, vous devrez faire une demande de contrat d'assurance emprunteur. L'organisme prêteur peut vous proposer son contrat d'assurance emprunteur ou le contrat d'assurance d'un de ses partenaires. On parle alors de contrat assurance groupe . Mais vous pouvez choisir de vous adresser à un autre assureur. C'est à partir du moment où vous aurez obtenu l'accord d'un assureur que l'organisme prêteur acceptera de vous faire une offre de crédit.

    — Crédit à la consommation : assurance de l'emprunteur · Comment choisir son assurance pour un crédit à la consommation ?
    Souvent, l'établissement qui vous accorde le crédit à la consommation vous envoie une proposition d'assurance en même temps que l'offre de prêt. L'assurance n'est pas légalement obligatoire en matière de crédit à la consommation. Toutefois, certains prêteurs peuvent exiger que vous souscriviez une assurance comme condition d'octroi du prêt. Si vous prenez une assurance alors qu'elle n'est pas imposée par le prêteur, vous pouvez choisir le contrat qui vous couvre le mieux. Vous devez comparer la proposition de votre organisme prêteur avec celles qui existent sur le marché. Les assureurs ont l'obligation d'indiquer clairement dans leurs publicités et dans leurs contrats les éléments qui permettent d'évaluer le coût de leurs prestations. Attention Soyez vigilant sur les garanties proposées, les exclusions, les délais de carence et les conditions de prise en charge mentionnés dans le contrat.

    — Comment obtenir un contrat d'assurance emprunteur pour un crédit immobilier ? · Dans quel cas faut-il remplir un questionnaire médical lors d'une demande d'assurance pour un crédit immobilier ?
    Les règles diffèrent selon les caractéristiques du crédit immobilier : Crédit de 200 000 € ou moins par assuré et à rembourser avant 60 ans L'assureur a interdiction de vous faire remplir un questionnaire de santé. Il ne doit pas non plus vous faire faire un examen de santé. Autre crédit Avant de vous proposer un contrat d'assurance emprunteur, l'assureur vous demande de compléter un questionnaire médical. Il évalue le risque à partir de vos réponses. Ce questionnaire doit être rempli en toute bonne foi . Toute omission (oubli volontaire) ou fausse déclaration intentionnelle est interdite. Si l'assureur vient à déceler la supercherie lorsque vous lui demandez le remboursement de votre crédit, il pourra refuser de vous indemniser ou obtenir la résiliation de votre contrat d'assurance. Au regard de vos réponses, 2 situations sont possibles : Si vous avez ou avez eu un risque de santé aggravé du fait d'une maladie ou d'un handicap, votre demande d'assurance emprunteur relève automatiquement de la convention Aeras . Si ce n'est pas le cas, l'assureur vous fait une proposition d'assurance indiquant notamment les garanties pour lesquelles il accorde la couverture, les conditions à remplir pour les déclencher, les exclusions, le montant de la cotisation mensuelle sur la durée totale de l'emprunt, le coût de l'assurance, les délais de carence .

    — Comment obtenir un contrat d'assurance emprunteur pour un crédit immobilier ? · Qu'est-ce que l'assurance emprunteur d'un crédit immobilier ?
    Une assurance emprunteur prend en charge le paiement de tout ou partie des échéances de remboursement de votre crédit immobilier restant dû lorsque vous êtes dans au moins 1 des situations suivantes : Décès et perte totale et irréversible d'autonomie Invalidité permanente (totale ou partielle) et incapacité temporaire de travail (totale ou partielle) Éventuellement, perte d'emploi (vous êtes libre de prendre ou non cette garantie).

    — Crédit à la consommation : assurance de l'emprunteur
    L'assurance emprunteur n'est pas obligatoire pour un crédit à la consommation. Néanmoins, le prêteur peut vous obliger à la prendre avant de vous accorder le crédit. Cette assurance vous protège contre les risques financiers liés au décès et à l'invalidité. Si vous avez des difficultés à trouver une assurance à cause de problèmes de santé, vous pouvez avoir recours à la convention Aeras . Nous vous présentons les informations à connaître.
