  question: Si je me fais contrôler sans assurance, est-ce que je risque vraiment de perdre mon permis
    ou de me faire confisquer ma voiture ?
  history: []
  expected_state: reponse
  gold_fiches:
  - F2628
  gold_spans:
  - Le fait de mettre en circulation un véhicule terrestre à moteur sans l'avoir assuré est un délit puni
    par une amende de 3 750 € .
  - 'En fonction des circonstances, une ou plusieurs des peines complémentaires suivantes peuvent être
    appliquées en plus : Travaux d''intérêt général Jours-amendes (amendes dont le montant est fixé par
    jour) Suspension du permis de conduire (jusqu''à 3 ans) Annulation du permis de conduire et l''interdiction
    de le repasser pendant un certain temps (3 ans au plus) Interdiction de conduire certains véhicules,
    même s''ils ne nécessitent pas le permis de conduire Obligation d''accomplir à ses frais un stage
    de sensibilisation à la sécurité routière Immobilisation et/ou confiscation du véhicule avec lequel
    l''infraction a été commise.'
  gold_articles:
  - LEGIARTI000006795642
  expected_points:
  - Conduire sans assurance est un délit passible d’une amende pouvant aller jusqu’à 3 750 €.
  - Le tribunal peut prononcer une suspension ou une annulation du permis de conduire, ainsi qu’une confiscation
    du véhicule.
  - Des peines complémentaires comme des travaux d’intérêt général ou un stage de sensibilisation peuvent
    également être imposées.
  tags:
  - ai_assisted
