  - L’obligation d’assurance cesse uniquement si le véhicule est considéré comme *hors d’état de circuler*,
    c’est-à-dire privé d’éléments essentiels comme les roues, la batterie ou le réservoir de carburant.
  - Même garé dans un jardin, un véhicule en état de rouler (ou potentiellement roulable) reste soumis
    à l’assurance obligatoire sous peine de sanctions.
