  question: Si ma voiture en leasing est volée ou détruite, est-ce que je vais devoir payer la différence
    entre ce que vaut la voiture aujourd’hui et ce que je dois encore au loueur ?
  history: []
  expected_state: reponse_sans_article
  gold_fiches:
  - F31329
  gold_spans:
  - Vous pouvez aussi souscrire une assurance spécifique au leasing. Elle permet de prendre en charge,
    en cas de destruction ou de vol du véhicule, la différence entre la valeur vénale et la valeur à neuf
    du véhicule.
  gold_articles: []
  expected_points:
  - Une assurance "perte financière" ou "gap" couvre spécifiquement ce risque en prenant en charge cet
    écart.
  - En cas de vol ou de destruction totale du véhicule en leasing, vous pourriez être tenu de payer la
    différence entre la valeur résiduelle du contrat et l’indemnisation versée par l’assurance.
  - Sans cette assurance complémentaire, la responsabilité du paiement de la différence vous incombe selon
    les termes du contrat de leasing.
  tags:
  - ai_assisted
