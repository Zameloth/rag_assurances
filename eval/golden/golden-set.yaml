  question: Et si c'est lui qui était ivre, et qu'il a pris la fuite, comment je fais pour être indemnisé
    alors ?
  history:
  - role: user
    content: Est-ce que mon assurance va me rembourser si je me blesse dans un accident alors que j’avais
      bu ?
  - role: assistant
    content: 'Non : si vous causez l''accident sous l''effet de l''alcool ou de drogues, votre assurance
      ne couvre pas vos propres dommages, ni corporels ni matériels. Les garanties comme l''individuelle
      accident ou la protection du conducteur peuvent être refusées dans ce cas.'
  expected_state: reponse
  gold_fiches:
  - F2630
  gold_spans:
  - Envoyer une demande d’indemnisation, via le formulaire dédié, au FGAO et joindre les justificatifs
    nécessaires (PV de police, certificats médicaux, devis de réparation,...)
  - Vous devez saisir le FGAO dans un délai de 3 ans après l’accident. Si un recours en justice est en
    cours, ce délai peut être prolongé.
  gold_articles:
