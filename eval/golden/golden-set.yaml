  question: Est-ce que mon association est obligée de prendre une assurance si on organise juste des réunions
    entre membres ?
  history: []
  expected_state: reponse
  gold_fiches:
  - F1124
  gold_spans:
  - Toutes les associations ne sont pas obligées de souscrire une assurance. Cependant, certaines activités
    exercées par une association imposent la souscription d’une assurance, notamment lorsque l’association
    organise des activités sportives, accueille des mineurs ou exerce certaines activités réglementées.
    Même lorsque l’assurance n’est pas obligatoire, il est recommandé d’en souscrire une afin de couvrir
    la responsabilité de l’association en cas de dommages causés à des tiers ou subis par ses membres.
