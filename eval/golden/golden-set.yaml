  question: Est-ce que je dois vraiment assurer ma vieille voiture qui ne roule plus et qui reste garée
    dans mon jardin ?
  history: []
  expected_state: reponse
  gold_fiches:
  - F23499
  gold_spans:
  - Un véhicule immatriculé reste soumis à l'obligation d'assurance tant qu’il n’a pas été formellement
    déclaré retiré de la circulation auprès de l’administration (via un certificat de retrait).
  - Si votre véhicule n'est plus en état de circuler, vous n'êtes pas obligé de l'assurer. Mais, attention,
    le véhicule qui n'est plus en état de circuler n'est pas juste le véhicule qui est tombé en panne.
    Il s'agit du véhicule auquel il manque les éléments essentiels pour pouvoir rouler, à savoir les roues,
    la batterie et le réservoir de carburant.
  gold_articles:
  - LEGIARTI000006795642
  expected_points:
  - Un véhicule immatriculé doit obligatoirement être assuré tant qu’il n’a pas été officiellement retiré
    de la circulation via un certificat de retrait administratif.
  - L’obligation d’assurance cesse uniquement si le véhicule est considéré comme *hors d’état de circuler*,
    c’est-à-dire privé d’éléments essentiels comme les roues, la batterie ou le réservoir de carburant.
  - Même garé dans un jardin, un véhicule en état de rouler (ou potentiellement roulable) reste soumis
    à l’assurance obligatoire sous peine de sanctions.
  tags:
  - ai_assisted
