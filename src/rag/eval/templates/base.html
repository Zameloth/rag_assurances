<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Golden-set annotation helper{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 1.25rem 1.5rem 4rem;
         max-width: 1200px; margin-inline: auto; line-height: 1.5; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; }
  a { color: inherit; }
  header { margin-bottom: 1rem; }
  input, select, textarea, button { font: inherit; }
  input[type="search"], input[type="text"] { width: 100%; box-sizing: border-box; padding: .4rem .5rem; }
  textarea { width: 100%; box-sizing: border-box; padding: .4rem .5rem; font-family: ui-monospace, monospace; }
  ul { list-style: none; padding: 0; margin: .5rem 0; }
  li { padding: .3rem 0; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
  .row { display: flex; gap: 1.5rem; align-items: flex-start; }
  .col { flex: 1; min-width: 0; }
  .chunk { padding: .5rem .6rem; margin: .3rem 0; border: 1px solid color-mix(in srgb, currentColor 15%, transparent);
           border-radius: 6px; cursor: text; }
  .chunk::selection { background: #ffe58a; color: #111; }
  .article-row { border: 1px solid color-mix(in srgb, currentColor 15%, transparent); border-radius: 6px;
                 padding: .5rem .6rem; margin: .35rem 0; }
  .article-row .meta { font-weight: 600; }
  .article-row .excerpt { opacity: .8; font-size: .92em; margin-top: .2rem; }
  .article-row button { margin-top: .35rem; }
  .chip-list { display: flex; flex-wrap: wrap; gap: .4rem; margin: .3rem 0; }
  .chip { border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: 999px;
          padding: .15rem .6rem; display: inline-flex; align-items: center; gap: .35rem; font-size: .9em; }
  .chip button { border: none; background: none; cursor: pointer; font: inherit; padding: 0; opacity: .7; }
  fieldset { border: 1px solid color-mix(in srgb, currentColor 15%, transparent); border-radius: 8px;
             margin: .75rem 0; padding: .75rem; }
  legend { font-weight: 600; padding: 0 .3rem; }
  .field { margin: .6rem 0; }
  .field label { display: block; font-weight: 600; margin-bottom: .25rem; }
  #save-status { margin-top: .75rem; padding: .6rem .75rem; border-radius: 6px; display: none; white-space: pre-wrap; }
  #save-status.ok { display: block; background: color-mix(in srgb, #2e7d32 20%, transparent); }
  #save-status.error { display: block; background: color-mix(in srgb, #c62828 20%, transparent); }
  .muted { opacity: .7; font-size: .9em; }
</style>
</head>
<body>
<header><a href="/">&larr; toutes les fiches</a></header>
{% block content %}{% endblock %}
</body>
</html>
