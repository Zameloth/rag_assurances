[project]
name = "rag-assurances"
version = "0.1.0"
description = "French-language RAG assistant over public French insurance law"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Théo ELOY" }]
# Upper bound is torch/FlagEmbedding wheel availability, not a language feature —
# BGE-M3 and the reranker land in the ingest and retrieval tickets.
requires-python = ">=3.12,<3.14"
dependencies = [
    # SPEC §16.3 — configuration is read from .env, never inline.
    "python-dotenv>=1.0",
    # SPEC §6.1 — the native client, not a LangChain VectorStore wrapper.
    "qdrant-client>=1.12",
    # SPEC §4 — the band is measured with BGE-M3's own tokenizer. The Rust `tokenizers`
    # library reads `tokenizer.json` straight from the HF hub cache without pulling in the
    # model weights (#26) or a torch runtime chunking never needs.
    "tokenizers>=0.23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
]
# SPEC §3.3 — the fetch script is a dev tool run by hand, never a pipeline stage, so its
# dependencies are not part of the default `uv sync` and are installed only when someone
# actually runs `uv sync --group fetch` to refresh the corpus.
fetch = [
    "pyarrow>=17",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
files = ["src", "tests", "scripts"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Not installed by default (see the `fetch` group above), so mypy cannot see its stubs
# without `uv sync --group fetch`. Silencing missing-import here still typechecks
# everything scripts/fetch_articles.py does with the values pyarrow returns.
module = "pyarrow.*"
ignore_missing_imports = true
