[project]
name = "rag-assurances"
version = "0.1.0"
description = "French-language RAG assistant over public French insurance law"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Théo ELOY" }]
# Upper bound is torch/FlagEmbedding wheel availability, not a language feature —
# BGE-M3 and the reranker land in the ingest and retrieval tickets.
requires-python = ">=3.12,<3.14"
dependencies = [
    # SPEC §16.3 — configuration is read from .env, never inline.
    "python-dotenv>=1.0",
    # SPEC §6.1 — the native client, not a LangChain VectorStore wrapper.
    "qdrant-client>=1.12",
    # SPEC §12.1 — the golden set is one repo-canonical YAML file (eval/golden/golden-set.yaml).
    "pyyaml>=6.0.3",
    # SPEC §4 — the band is measured with BGE-M3's own tokenizer. The Rust `tokenizers`
    # library reads `tokenizer.json` straight from the HF hub cache without pulling in the
    # model weights (#26) or a torch runtime chunking never needs.
    "tokenizers>=0.23.1",
]

[tool.uv]
# Unlike `fetch` (network calls, heavy binary deps, never imported by tests), `annotate`
# backs real route-tested code (`tests/test_annotate_app.py`) — CI needs it installed to
# typecheck and test `rag.eval.annotate_app`, so it is a default group, not an opt-in one.
default-groups = ["dev", "annotate"]

[dependency-groups]
# #33 — the annotation helper is a hand-run local tool, never imported by the pipeline
# stages, but its FastAPI + Jinja stack (SPEC §13, reused early rather than inventing a
# second one) is exercised by the test suite, unlike `fetch`'s scripts below.
annotate = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "uvicorn[standard]>=0.52.1",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.16.1",
    "pytest-cov>=7.1.0",
    "types-pyyaml>=6.0.12.20260724",
]
# SPEC §3.3 — the fetch script is a dev tool run by hand, never a pipeline stage, so its
# dependencies are not part of the default `uv sync` and are installed only when someone
# actually runs `uv sync --group fetch` to refresh the corpus.
fetch = [
    "pyarrow>=17",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=rag --cov-report=term-missing"

[tool.coverage.run]
source = ["src/rag"]

[tool.coverage.report]
# Below the current 95% (`text_split.py`'s untested word-split fallback is the gap — SPEC
# says it's not observed on the corpus, so it's a deliberate safety valve, not a hole to
# close here) but high enough that a real regression still fails the build.
fail_under = 90

[tool.mypy]
files = ["src", "tests", "scripts"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Not installed by default (see the `fetch` group above), so mypy cannot see its stubs
# without `uv sync --group fetch`. Silencing missing-import here still typechecks
# everything scripts/fetch_articles.py does with the values pyarrow returns.
module = "pyarrow.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E5 (line-length) is deliberately left out: several files predate this config with longer
# lines (long literals in tests, DILA URLs), and retrofitting them is a separate, noisier
# change from turning the linter on. E4/E7/E9 are ruff's own default error set.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
